image: node:20

stages:
  - build
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - frontend/node_modules/
    - backend/node_modules/

backend-build:
  stage: build
  script:
    - cd backend
    - npm ci
    - npm run build
  only:
    - main

pages:
  stage: deploy
  script:
    - cd frontend
    - npm ci
    - npm run build -- --base=/
    - cp dist/index.html dist/404.html
    - mv dist ../public
  artifacts:
    paths:
      - public
  variables:
    # Set VITE_API_URL_PROD in GitLab → Settings → CI/CD → Variables
    # so the backend URL is not hardcoded into the pipeline file.
    VITE_API_URL: $VITE_API_URL_PROD
  only:
    - main
